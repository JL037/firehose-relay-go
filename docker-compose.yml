# SCAFFOLD: local dev stack. Postgres is here now; the relay service and the
# Prometheus/Grafana monitoring profile are TODO (weeks 3 and 6).
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: relay
      POSTGRES_PASSWORD: relay
      POSTGRES_DB: relay
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # relay:
  #   build: .
  #   depends_on: [postgres]
  #   ports: ["8080:8080"]
  #   environment:
  #     DATABASE_URL: postgres://relay:relay@postgres:5432/relay?sslmode=disable

volumes:
  pgdata:
